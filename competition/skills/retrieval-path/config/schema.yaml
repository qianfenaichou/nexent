top_k:
  type: number
  required: false
  description_en: "Top-k hits for knowledge_base_search and kg_search"
  description_zh: "knowledge_base_search 与 kg_search 的 top_k"
hop:
  type: number
  required: false
  description_en: "kg_search neighborhood hop (retrieval path stays at 1)"
